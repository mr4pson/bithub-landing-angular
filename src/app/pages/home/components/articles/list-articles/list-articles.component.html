<ng-container *ngIf="!dataService.articles.length"
  ><div class="loading">
    <span>{{words['common']?.['loading']?.[lang.slug]}}</span>
  </div></ng-container
>
<ng-container *ngIf="dataService.articles.length">
  <div class="articles">
    <div class="a-content">
      <div class="a-title">
        {{words['home']?.['articles-title']?.[lang.slug]}}
      </div>
      <ng-container *ngIf="!dataService.articles?.length"
        ><span>{{words['common']?.['empty']?.[lang.slug]}}</span></ng-container
      >
      <ng-container *ngIf="dataService.articles?.length">
        <div class="a-items" [class.busy]="loading">
          <div
            class="a-item"
            *ngFor="let article of dataService.articles; let i = index"
          >
            <the-article [article]="article"></the-article>
          </div>
        </div>
      </ng-container>
    </div>
  </div>
</ng-container>
